services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-ai_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-gateway:
    build: .
    expose:
      - "8000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - WORKSPACE_DIR=/workspace
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ai_gateway}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_gateway}
      - AGENT_POOL_SIZE=${AGENT_POOL_SIZE:-4}
      - SKILL_ROOT_DIR=/app/skills
    volumes:
      - codex-auth:/home/appuser/.codex
      - claude-auth:/home/appuser/.claude
      - workspace:/workspace
      - ./skills:/app/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      uv run --project /app granian --interface asgi app.main:app --host 0.0.0.0 --port 8000

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-gateway
    restart: unless-stopped

volumes:
  codex-auth:
  claude-auth:
  workspace:
  postgres-data:
