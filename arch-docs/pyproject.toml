[project]
name = "arch-docs"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "granian>=1.5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "that-depends>=0.13.0",
    "microbootstrap[fastapi]>=0.10.0",
    "structlog>=24.0.0",
    "fastmcp>=0.9.0",
    "stamina>=24.0.0",
    "python-multipart>=0.0.9",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "asyncpg>=0.29.0",
    "advanced-alchemy>=0.20.0",
    "alembic>=1.13.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
]

[tool.ruff]
fix = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = ["EM", "FBT", "TRY003", "D1", "D203", "D213", "G004", "FA", "COM812", "ISC001", "ANN", "UP", "TRY400", "TC002", "TC001", "INP001", "RUF001", "D400", "D415"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["S101", "S311", "PLR2004", "ARG001", "SLF001", "PLC0415", "SIM117", "SIM105", "C408", "RUF006", "E501"]
"tests/**/*.py" = ["S101", "S311", "PLR2004", "ARG001", "SLF001", "PLC0415", "SIM117", "SIM105", "C408", "RUF006", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
exclude_also = ["if typing.TYPE_CHECKING:"]
fail_under = 90

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
