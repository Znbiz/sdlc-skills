services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arch_docs}
      POSTGRES_USER: ${POSTGRES_USER:-arch_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arch_docs}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  arch-docs:
    build: ./back
    expose:
      - "8000"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
      - WORKSPACE_DIR=/workspace
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-arch_docs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arch_docs}
      - AGENT_POOL_SIZE=${AGENT_POOL_SIZE:-4}
      - SKILL_ROOT_DIR=/app/skills
      - WORKFLOWS__INIT__MAX_STEP_TIMEOUT_SECONDS=${INIT_ARCH_MAX_STEP_TIMEOUT_SECONDS:-900}
      - WORKFLOWS__INIT__ARCH_REPO_DIRNAME=${INIT_ARCH_ARCH_REPO_DIRNAME:-arch-doc}
      - AUDIT__MAX_PROMPT_CHARS=${AUDIT_MAX_PROMPT_CHARS:-12000}
      - AUDIT__MAX_OUTPUT_CHARS=${AUDIT_MAX_OUTPUT_CHARS:-16000}
      - AUDIT__MAX_ERROR_CHARS=${AUDIT_MAX_ERROR_CHARS:-8000}
    volumes:
      - codex-auth:/home/appuser/.codex
      - claude-auth:/home/appuser/.claude
      - git-credentials:/home/appuser/.config/git-credentials-store
      - git-ssh:/home/appuser/.ssh
      - workspace:/workspace
      - ./back/skills:/app/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      uv run --project /app granian --interface asgi app.main:app --host 0.0.0.0 --port 8000

  arch-docs-front:
    build:
      context: ./front
      args:
        VITE_API_BASE_PATH: /api
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    environment:
      - AUTH_SECRET=${AUTH_SECRET}
    volumes:
      - ./nginx-templates:/etc/nginx/templates:ro
    depends_on:
      - arch-docs
      - arch-docs-front
    restart: unless-stopped

volumes:
  codex-auth:
  claude-auth:
  git-credentials:
  git-ssh:
  workspace:
  postgres-data:
