services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: arch_docs_test
      POSTGRES_PASSWORD: arch_docs_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arch_docs_test"]
      interval: 2s
      timeout: 3s
      retries: 20
